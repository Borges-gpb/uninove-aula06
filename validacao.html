<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Validação Interativa</title>
    <style>
        /* Estilizando o fundo da página */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fcf4f7; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Estilizando a caixinha do formulário */
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(255, 0, 212, 0.15); /* Sombra na cor do seu rosa */
            width: 100%;
            max-width: 360px;
        }

        h1 { 
            font-size: 1.8rem;
            color: #333;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
        }

        .campo { margin-bottom: 18px; }

        label { 
            display: block; 
            margin-bottom: 6px; 
            color: #555;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* Deixando os inputs modernos e arredondados */
        input { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box; 
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        /* Quando clica no campo, a borda acende no seu rosa choque */
        input:focus {
            border-color: #ff00d4;
            outline: none;
        }

        /* Botão estilizado com o SEU Rosa Choque (#ff00d4) */
        button { 
            width: 100%; 
            padding: 12px; 
            background-color: #ff00d4; /* Rosa Choque Neon */
            color: white; 
            border: none; 
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer; 
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 10px;
        }

        /* Efeito de passar o mouse (fica um rosa levemente mais escuro) */
        button:hover { 
            background-color: #cc00aa; 
        }

        /* Efeito de clique no botão */
        button:active {
            transform: scale(0.98);
        }

        /* Mensagens de erro e sucesso */
        #erro { 
            font-weight: 600; 
            margin-top: 15px; 
            text-align: center;
            font-size: 0.95rem;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Cadastro Geral</h1>

        <form id="meuForm">
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" placeholder="Digite seu nome completo">
            </div>
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="text" id="email" placeholder="exemplo@email.com">
            </div>
            <div class="campo">
                <label for="idade">Idade:</label>
                <input type="number" id="idade" placeholder="Sua idade">
            </div>
            <button type="submit">Enviar Dados</button>
        </form>

        <p id="erro"></p>
    </div>

    <script src="validacao.js"></script>
</body>
</html>
