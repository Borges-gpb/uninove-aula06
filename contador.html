<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contador Interativo</title>
    <style>
        /* Estilizando o fundo da página (igual ao do formulário) */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #fcf4f7; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* Caixinha centralizada do contador */
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(255, 0, 212, 0.15);
            text-align: center;
            width: 100%;
            max-width: 320px;
        }

        h2 { 
            color: #555; 
            margin: 0; 
            font-size: 1.1rem; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* O número grande do contador */
        #numero { 
            font-size: 5rem; 
            font-weight: bold; 
            margin: 20px 0;
            transition: color 0.3s;
        }

        /* Alinhando os botões lado a lado */
        .botoes {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        /* Base de estilo para todos os botões */
        button { 
            font-size: 0.95rem; 
            font-weight: bold;
            padding: 12px 18px; 
            border: none;
            border-radius: 8px;
            cursor: pointer; 
            transition: transform 0.1s, background-color 0.2s;
            flex: 1;
        }

        /* Botão Diminuir: Rosa mais escuro/fechado */
        #btnDecrementar { 
            background-color: #b30059; 
            color: white; 
        }
        #btnDecrementar:hover { 
            background-color: #8c0046; 
        }

        /* Botão Zerar: Rosa pastel elegante */
        #btnZerar { 
            background-color: #ffb3d9; 
            color: #4a0026; 
        }
        #btnZerar:hover { 
            background-color: #ff99cc; 
        }

        /* Botão Aumentar: O seu Rosa Choque Neon (#ff00d4) */
        #btnIncrementar { 
            background-color: #ff00d4; 
            color: white; 
        }
        #btnIncrementar:hover { 
            background-color: #cc00aa; 
        }

        /* Efeito de clique físico no botão */
        button:active { 
            transform: scale(0.95); 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Contador Interativo</h2>
        <h1 id="numero">0</h1>
        
        <div class="botoes">
            <button id="btnDecrementar">Diminuir</button>
            <button id="btnZerar">Zerar</button>
            <button id="btnIncrementar">Aumentar</button>
        </div>
    </div>

    <script src="contador.js"></script>
</body>
</html>
