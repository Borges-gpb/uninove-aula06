<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Contador Interativo</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 { color: #666; margin: 0; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

        #numero { 
            font-size: 5rem; 
            font-weight: bold; 
            margin: 20px 0;
            transition: color 0.3s;
        }

        .botoes {
            display: flex;
            gap: 10px;
        }

        button { 
            font-size: 1rem; 
            font-weight: bold;
            padding: 12px 20px; 
            border: none;
            border-radius: 8px;
            cursor: pointer; 
            transition: transform 0.1s, background-color 0.2s;
        }

        #btnIncrementar { background-color: #28a745; color: white; }
        #btnIncrementar:hover { background-color: #218838; }

        #btnDecrementar { background-color: #dc3545; color: white; }
        #btnDecrementar:hover { background-color: #c82333; }

        #btnZerar { background-color: #6c757d; color: white; }
        #btnZerar:hover { background-color: #5a6268; }

        /* Efeito de clique no botão */
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="container">
        <h2>Contador Interativo</h2>
        <h1 id="numero">0</h1>
        
        <div class="botoes">
            <button id="btnDecrementar">Diminuir</button>
            <button id="btnZerar">Zerar</button>
            <button id="btnIncrementar">Aumentar</button>
        </div>
    </div>

    <script src="contador.js"></script>
</body>
</html>
